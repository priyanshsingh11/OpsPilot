{% extends "base.html" %}{% block body %}
<h1>Interviews</h1>
<form method="get"><input type="date" name="day" value="{{ day }}" data-testid="cal-day"><button data-testid="cal-apply">Show</button></form>
<table><tr><th>Date</th><th>Start</th><th>Min</th><th>Interviewer</th><th>Candidate</th></tr>
{% for r in rows %}<tr data-testid="interview-row" data-day="{{ r.day }}" data-start="{{ r.start }}" data-duration="{{ r.duration }}" data-interviewer="{{ r.interviewer }}" data-candidate="{{ r.name }}">
<td>{{ r.day }}</td><td>{{ r.start }}</td><td>{{ r.duration }}</td><td>{{ r.interviewer }}</td><td>{{ r.name }}</td></tr>
{% else %}<tr><td colspan="5">No interviews.</td></tr>{% endfor %}</table>
{% endblock %}
