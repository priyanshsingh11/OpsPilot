{% extends "base.html" %}{% block body %}
<h1>Candidates</h1>
<form method="get" data-testid="filter-form">
  <select name="job" data-testid="filter-job"><option value="">All jobs</option>
  {% for j in jobs %}<option {{ 'selected' if j.title==job }}>{{ j.title }}</option>{% endfor %}</select>
  <select name="status" data-testid="filter-status"><option value="">All statuses</option>
  {% for s in statuses %}<option {{ 'selected' if s==status }}>{{ s }}</option>{% endfor %}</select>
  <button type="submit" data-testid="filter-apply">Filter</button>
</form>
<table><tr><th>ID</th><th>Name</th><th>Job</th><th>Status</th></tr>
{% for r in rows %}<tr data-testid="candidate-row" data-id="{{ r.id }}">
  <td>{{ r.id }}</td><td><a href="/candidates/{{ r.id }}">{{ r.name }}</a></td><td>{{ r.job }}</td><td>{{ r.status }}</td></tr>
{% else %}<tr><td colspan="4">No candidates.</td></tr>{% endfor %}</table>
{% endblock %}
